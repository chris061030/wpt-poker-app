name: Build WPT Player Notes APK

on:
  push:
    branches:
      - codex/wpt-player-notes-exe
    paths:
      - "android-app/**"
      - ".github/workflows/build-wpt-player-notes-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx cap add android
      - name: Synchronize app
        run: npx cap sync android
      - name: Build signed debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../WPT_Player_Notes.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WPT-Player-Notes-Android
          path: android-app/WPT_Player_Notes.apk
          if-no-files-found: error
          retention-days: 30
